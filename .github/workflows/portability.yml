name: portability

# Scoring-path portability checks on macOS and Windows without the optional GRIB extra.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Harness lock, tree and dependency pins
        run: uv run python -P scripts/harness_lock.py check
      - run: uv run ruff check
      - run: uv run pytest -rs -q
