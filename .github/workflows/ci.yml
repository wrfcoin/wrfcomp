name: ci

# Hash check, lint and tests. The owner-approval gate for the locked harness is NOT here: it lives
# in harness-lock.yml, which runs from the base branch (docs/HARNESS_LOCK.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Harness lock, tree and dependency pins
        run: python3 -P scripts/harness_lock.py check
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev --extra grib
      - run: uv run ruff check
      - run: uv run pytest -q
