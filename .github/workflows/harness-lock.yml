name: harness-lock

# Owner-approval gate for the locked harness (docs/HARNESS_LOCK.md).
#
# pull_request_target runs the workflow definition of the BASE branch, never the pull request's.
# This workflow checks out nothing: it fetches its gate script from the same base commit through
# the API and reads the pull request through the API. Code from the pull request is never run here.
#
# `harness-lock` must be a required status check on main, next to `test` from ci.yml.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions: {}

concurrency:
  group: harness-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  withdraw-approval:
    # A new push withdraws the owner's approval: the label is removed, so every head needs a fresh one.
    name: withdraw approval on a new push
    if: github.event.action == 'synchronize'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Remove the owner-approval label
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/unlabel.json" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/issues/${PR_NUMBER}/labels/owner-approved-harness-change")
          case "$code" in
            200) echo "Label removed: this push needs a fresh owner approval." ;;
            404) echo "The label was not on the pull request." ;;
            *) echo "Could not remove the label (HTTP ${code})."; exit 1 ;;
          esac

  harness-lock:
    name: harness-lock
    needs: withdraw-approval
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Fetch the gate from the base commit (no checkout of pull-request code)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/contents/.github/harness_lock_gate.py?ref=${WORKFLOW_SHA}" \
            -o "$RUNNER_TEMP/harness_lock_gate.py"
      - name: Owner approval for locked paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WITHDRAW_RESULT: ${{ needs.withdraw-approval.result }}
        run: python3 "$RUNNER_TEMP/harness_lock_gate.py"
