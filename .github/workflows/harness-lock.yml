name: harness-lock

# Owner-approval gate for the locked harness (docs/HARNESS_LOCK.md).
#
# pull_request_target runs the workflow definition of the BASE branch, never the pull request's.
# This workflow checks out nothing: it fetches its gate script from the same base commit through
# the API and reads the pull request through the API. Code from the pull request is never run here.
# It has no write permission and no shared concurrency group: each run judges the head it was
# started for, on the base commit its own policy was fetched from, and nothing else.
#
# Approval is a comment by the project owner naming the exact head commit. After the owner has
# commented, run this check again (re-run the job, or add or remove any label on the pull request).
#
# `harness-lock` must be a required status check on main, next to `test` from ci.yml.

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions: {}

jobs:
  harness-lock:
    name: harness-lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Fetch the gate from the base commit (no checkout of pull-request code)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${REPOSITORY}/contents/.github/harness_lock_gate.py?ref=${WORKFLOW_SHA}" \
            -o "$RUNNER_TEMP/harness_lock_gate.py"
      - name: Owner approval of this exact commit for locked paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_SHA: ${{ github.sha }}
        run: python3 "$RUNNER_TEMP/harness_lock_gate.py"
